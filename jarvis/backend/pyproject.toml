[tool.poetry]
name = "jarvis-brain"
version = "0.1.0"
description = "Jarvis assistant backend"
authors = ["Jarvis AI <jarvis@example.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
SQLAlchemy = "^2.0"
asyncpg = "^0.29"
psycopg = {extras = ["binary"], version = "^3.1"}
alembic = "^1.13"
structlog = "^24.1"
httpx = "^0.27"
celery = "^5.3"
redis = "^5.0"
aioredis = "^2.0.1"
python-dotenv = "^1.0"
pydantic = "^2.7"
pydantic-settings = "^2.2"
pgvector = "^0.2.5"
numpy = "^1.26"
sentence-transformers = "^2.7"
pytz = "^2024.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
ruff = "^0.4.0"
mypy = "^1.8"

[build-system]
requires = ["poetry-core>=1.4.0"]
build-backend = "poetry.core.masonry.api"
